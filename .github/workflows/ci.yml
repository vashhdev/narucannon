# naru health pipeline. each stage only runs if the one before it is green:
#
#   1 lint -> 2 test -> 3 build -> 4 install -> 6 release (tags only)
#                    \-> 5 live share check
#
# "all checks passed" sums up 1-4 and is the check branch protection requires.
#
# runs on every push and pull request, daily (to catch the NaruCannon shares moving
# or changing, and runner image drift), on demand from the Actions tab, and on v* tags
# to release.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: 1 · lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: ruff (naru.py, tests)
        run: uvx ruff check --output-format github .
      - name: shellcheck (install.sh)
        run: shellcheck install.sh
      - name: parse (install.ps1)
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors)
          if ($errors) { $errors; exit 1 }

  test:
    name: 2 · test (${{ matrix.os }}, py${{ matrix.python }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.13"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15               # a hung test fails the job instead of holding it 6 hours
    env:
      PYTHONIOENCODING: utf-8         # "Chūnin" in test output on Windows runners
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: unit tests (offline, fixtures)
        run: uv run --no-project --python ${{ matrix.python }} python -m unittest discover -s tests -v
      - name: cli smoke
        run: |
          uv run --no-project --python ${{ matrix.python }} python naru.py --version
          uv run --no-project --python ${{ matrix.python }} python naru.py --help

  build:
    name: 3 · build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - name: sdist + wheel
        run: uv build
      - name: check package metadata
        run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  install:
    # the real one-line installers on fresh machines (no uv, no mpv), installing the
    # wheel from stage 3, then mpv through the system package manager, then playing
    # a generated test clip through whatever player naru found
    name: 4 · install (${{ matrix.os }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30               # a hung mpv fails the job instead of holding it 6 hours
    env:
      NARU_YES: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: install.sh, piped like curl | sh
        if: runner.os != 'Windows'
        run: |
          export NARU_PKG="$(ls "$PWD"/dist/*.whl)"
          sh < install.sh
      - name: install.ps1, piped like irm | iex
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:NARU_PKG = (Get-ChildItem dist\*.whl).FullName
          Get-Content .\install.ps1 -Raw | Invoke-Expression
      - name: naru runs, mpv found and plays
        if: runner.os != 'Windows'
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          naru --version
          ready="$(naru --setup)" && echo "$ready"
          mpv="${ready#ready: }"
          # unquoted on purpose: "flatpak run io.mpv.Mpv" has to split into words
          $mpv --vo=null --ao=null --frames=10 av://lavfi:testsrc=duration=1
          # this mpv build runs a whole binge session (episodes appended over its IPC
          # socket while one plays) and the chapter skipper
          NARU_TEST_MPV="$mpv" python3 -m unittest -v \
            tests.test_naru.Session.test_real_mpv_plays_a_whole_session_in_one_window \
            tests.test_naru.ChapterSkip.test_real_mpv_skips_the_opening_and_the_ending \
            tests.test_naru.ChapterSkip.test_real_mpv_rewind_pgdn_and_the_skip_key
      - name: naru runs, mpv found and plays
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:Path = "$env:USERPROFILE\.local\bin;$env:Path"
          naru --version
          $ready = naru --setup
          $ready
          $mpv = $ready -replace '^ready: ', ''
          & $mpv --vo=null --ao=null --frames=10 av://lavfi:testsrc=duration=1
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # this mpv build runs a whole binge session (episodes appended over its IPC
          # named pipe while one plays) and the chapter skipper
          $env:NARU_TEST_MPV = $mpv
          python -m unittest -v `
            tests.test_naru.Session.test_real_mpv_plays_a_whole_session_in_one_window `
            tests.test_naru.ChapterSkip.test_real_mpv_skips_the_opening_and_the_ending `
            tests.test_naru.ChapterSkip.test_real_mpv_rewind_pgdn_and_the_skip_key
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

  ok:
    # the one check branch protection requires, so matrix renames don't break it.
    # runs even when a stage fails (a skipped required check would count as passing)
    # and is green only if every required stage is. live and termux stay advisory:
    # a pixeldrain outage or a termux image change shouldn't block merges.
    name: all checks passed
    if: ${{ !cancelled() }}
    needs: [lint, test, build, install]
    runs-on: ubuntu-latest
    steps:
      - name: required stages
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "lint test build install: $RESULTS"
          for r in $RESULTS; do test "$r" = success; done

  install-termux:
    # Termux userland in Docker: covers the installer's Termux branch (pkg + pip) and
    # the Android player hand-off. the mpv-android app itself can't run here.
    name: 4 · install (android / termux, experimental)
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: install.sh inside termux-docker
        run: |
          docker run --rm -e TERMUX_VERSION=docker -e NARU_YES=1 -v "$PWD:/src:ro" \
            termux/termux-docker:x86_64 bash -c '
              set -e
              export NARU_PKG="$(ls /src/dist/*.whl)"
              sh < /src/install.sh
              naru --version
              naru --setup | grep -q is.xyz.mpv'

  live:
    # reads the real NaruCannon shares on pixeldrain: every arc folder of both, then
    # mpv opens real episodes (one behind an accented arc name, one in the extended
    # folder) and finds the chapters the skipper goes by. a failure here with green
    # tests means the shares moved or changed shape.
    name: 5 · live share check
    needs: test
    runs-on: ubuntu-latest
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - name: every arc of both shares
        run: |
          set -o pipefail
          for lang in --sub --dub; do
            python3 naru.py --list $lang | tee list.txt
            head -n 1 list.txt | grep -qE '^NaruCannon \((sub|dub)\): [0-9]+ episodes in ([0-9]{2,}) arcs$'
          done
      - name: mpv
        run: python3 naru.py --setup --yes
      - name: episodes play in mpv, with chapters
        run: |
          set -o pipefail
          for args in "land 1 --sub" "chunin 1 --dub" "chunin 16 --sub --extended"; do
            url="$(python3 naru.py $args --print)"
            echo "$args: $url"
            mpv --no-config --vo=null --ao=null --frames=1 --ytdl=no \
              --term-playing-msg='chapters=${chapter-list/count} duration=${=duration}' "$url" 2>&1 | tee mpv.log
            grep -qE '^chapters=[1-9]' mpv.log
          done

  release:
    name: 6 · release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: install
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: tag matches __version__
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 naru.py --version | cut -d' ' -f2)"
      - name: release notes from CHANGELOG
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            /^## \[/ { on = 0 }
            on' CHANGELOG.md > notes.md
          test -s notes.md && cat notes.md
      - name: publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md
