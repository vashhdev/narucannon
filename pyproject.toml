[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "narucanon-mpv"
version = "1.0.0"
description = "Stream the NaruCannon Recut (canon-only Naruto and Shippuden) in mpv - interactive picker, zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Vashistha Pandya" }]
keywords = ["naruto", "narucannon", "anime", "mpv", "pixeldrain", "cli", "streaming"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = []  # stdlib only, by design

[project.urls]
Homepage = "https://github.com/vashhdev/narucanon"
Issues = "https://github.com/vashhdev/narucanon/issues"

[project.scripts]
naru = "naru:main"

[tool.setuptools]
py-modules = ["naru"]

[tool.ruff]
target-version = "py38"
line-length = 110

[tool.ruff.lint]
# pyflakes, pycodestyle errors, bugbear. E401: `import termios, tty, select` is the
# onepace house style for the optional POSIX imports
select = ["E", "F", "B", "W"]
ignore = ["E401"]
